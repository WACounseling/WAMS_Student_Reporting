<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A1B">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WAMS Reporting">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Woodward Academy Middle School: Confidential Student Reporting Form and Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   BRAND TOKENS — change colors/fonts here and the whole app follows.
   Woodward Academy palette: red, white, and black.
   Red (#A10832) and black (#1C1A1B) were sampled from the official WA logo.
------------------------------------------------------------------- */
:root{
  --bg:#F4F4F4;
  --surface:#FFFFFF;
  --ink:#111111;
  --soft:#575757;
  --brand:#1C1A1B;
  --on-brand:#FFFFFF;
  --red:#A10832;
  --on-red:#FFFFFF;
  --red-tint:#FBEAEC;
  --rose:#F0B4BC;
  --rose-tint:#FBEAEC;
  --line:#DEDEDE;
  --link:#111111;
  --focus:#A10832;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.10);
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B;--surface:#1A1A1A;--ink:#F2F2F2;--soft:#B8B8B8;
    --red-tint:#2E1519;--rose-tint:#2E1519;--brand:#000000;--line:#333333;
    --link:#FFFFFF;--focus:#F4C6CC;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B;--surface:#1A1A1A;--ink:#F2F2F2;--soft:#B8B8B8;
  --red-tint:#2E1519;--rose-tint:#2E1519;--brand:#000000;--line:#333333;
  --link:#FFFFFF;--focus:#F4C6CC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding-inline:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px;padding-block:8px}
.mark{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:inherit;min-width:0}
.mark b{font-family:var(--serif);font-weight:600;font-size:1.3rem;letter-spacing:.003em;color:#fff}
.mark span{font-size:.78rem;color:rgba(255,255,255,.85);font-weight:500;margin-top:2px}
.wa{flex:none;display:block;height:40px;width:auto}

/* ---------- Hero (home) ---------- */
.hero{background:var(--brand);color:var(--on-brand);padding:26px 0 70px;text-align:center}
.hero h1{margin:0 0 10px;font-family:var(--serif);font-weight:500;line-height:1.05;font-size:clamp(1.75rem,6.5vw,2.3rem);letter-spacing:-.01em}
.hero .tag{font-family:var(--serif);font-size:1.25rem;line-height:1.35;margin:0 0 12px;max-width:30ch}
.hero .intro{margin:0;max-width:52ch;color:rgba(255,255,255,.88);font-size:1rem}
.hero .tag,.hero .intro{margin-inline:auto}

/* ---------- Report tile (the one loud thing) ---------- */
.report-tile{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;background:var(--red);color:var(--on-red);text-decoration:none;border-radius:18px;padding:20px 20px 20px 22px;margin-top:-50px;box-shadow:var(--shadow)}
.report-tile .ico{width:2.2rem;height:2.2rem;grid-row:span 2;stroke-width:1.6}
.report-tile strong{font-family:var(--serif);font-size:1.55rem;font-weight:600;line-height:1.1}
.report-tile small{font-size:.95rem;line-height:1.35;font-weight:500}
.report-tile:hover{filter:brightness(1.03)}
.report-tile:active{transform:translateY(1px)}

/* ---------- Generic ---------- */
main{display:block;padding-bottom:110px;outline:none}
.page-head{padding:22px 0 6px}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,7vw,2.4rem);line-height:1.1;margin:10px 0 8px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--soft);max-width:52ch}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--link);padding:6px 0}
.back .ico{width:1.1em;height:1.1em}
h2.sec{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.2;margin:34px 0 12px}
.lead{font-size:1.1rem}

.notice{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:12px;padding:16px;margin-top:18px}
.notice .ico{color:var(--link);margin-top:2px}
.notice p{margin:0 0 10px}
.notice p:last-child{margin-bottom:0}
.notice .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;font:inherit;font-weight:700;font-size:1rem;text-decoration:none;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.btn.big{width:100%;min-height:64px;font-size:1.1rem;line-height:1.2;justify-content:flex-start;text-align:left;gap:14px;padding:8px 18px 8px 8px;background:var(--red);border-color:var(--red);color:var(--on-red)}
.help-ico{width:48px;height:48px;flex:none;display:block}
.notice .row .btn.big{flex:1 1 100%}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.95rem}
.btn:hover{filter:brightness(1.06)}

/* ---------- Topic list ---------- */
.topics{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.topics li+li{border-top:1px solid var(--line)}
.topics a{display:flex;align-items:center;gap:14px;padding:15px 16px;text-decoration:none;color:var(--ink)}
.topics a:hover{background:var(--bg)}
.topics .badge{width:46px;height:46px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.topics .badge .ico{width:24px;height:24px}
.topics .txt{flex:1;min-width:0}
.topics .txt b{display:block;font-family:var(--serif);font-size:1.22rem;font-weight:600;line-height:1.15}
.topics .txt span{display:block;color:var(--soft);font-size:.95rem;line-height:1.3;margin-top:2px}
.topics .go{color:var(--soft);width:1.3em;height:1.3em}
.topics li.unsure .badge{background:var(--rose);color:#3b2326}

.linkrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;text-decoration:none;color:var(--ink)}
.linkrow .ico:first-child{color:var(--link);width:1.6em;height:1.6em}
.linkrow b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.linkrow span{color:var(--soft);font-size:.95rem;display:block;line-height:1.3}
.linkrow .go{margin-left:auto;color:var(--soft)}

/* ---------- Topic page ---------- */
.topic-icon{width:54px;height:54px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.topic-icon .ico{width:28px;height:28px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:20px 0 6px;gap:4px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;font-size:.98rem;color:var(--soft);padding:10px 8px;border-radius:999px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.block{margin:26px 0;padding-left:16px;border-left:3px solid var(--line)}
.friend .block{border-left-color:var(--rose)}
.block h3{font-family:var(--serif);font-weight:600;font-size:1.4rem;line-height:1.2;margin:0 0 8px}
.block p{margin:0 0 12px;max-width:60ch}
.block ul{margin:0 0 12px;padding-left:1.25em;max-width:60ch}
.block li{margin-bottom:7px}
.block.key{background:var(--red-tint);border-left:6px solid var(--red);padding:16px 16px 6px;border-radius:0 12px 12px 0}
.block.key+.block.key{margin-top:-10px}
.links{list-style:none;padding:0!important;margin:14px 0 14px!important;display:grid;gap:8px}
.links li{margin:0}
.links a{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--link);font-weight:600;line-height:1.25}
.links a small{display:block;color:var(--soft);font-weight:400;font-size:.85rem;margin-top:2px}
.links a .ico{margin-left:auto;color:var(--soft);width:1.1em;height:1.1em}
.links a:hover{border-color:var(--link)}
.compare{display:grid;gap:10px;margin:12px 0 4px}
@media(min-width:560px){.compare{grid-template-columns:1fr 1fr}}
.compare>div{border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.compare>div.yes{border-color:var(--brand);border-width:2px}
.compare h4{margin:0 0 6px;font-family:var(--serif);font-size:1.25rem}
.compare ul{margin:0;padding-left:1.15em}

.next{margin-top:34px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.next h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 4px}
.next p{margin:0 0 14px;color:var(--soft)}
.next .row{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Crisis lines ---------- */
.lines{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.line{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.line b{font-family:var(--serif);font-size:1.18rem;font-weight:600;display:block;line-height:1.2}
.line p{margin:2px 0 10px;color:var(--soft);font-size:.97rem;line-height:1.35}
.line .row{display:flex;flex-wrap:wrap;gap:8px}
.crisis{margin:24px 0;background:var(--brand);color:var(--on-brand);border-radius:16px;padding:18px 16px 16px;border-bottom:5px solid var(--red)}
.crisis h2{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin:0 0 4px}
.crisis>p{margin:0;color:rgba(255,255,255,.88);font-size:.98rem}
.crisis .line{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:inherit}
.crisis .line p{color:rgba(255,255,255,.82)}
.crisis .btn{background:#FFFFFF;border-color:#FFFFFF;color:var(--brand)}

/* ---------- People ---------- */
.people{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.person{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;box-shadow:var(--shadow)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--serif);font-size:1.5rem;font-weight:600;grid-row:span 2;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.person h3{margin:0;font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.15}
.person .role{margin:0;color:var(--soft);font-size:.97rem;line-height:1.3}
.person .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.person .addr{grid-column:1/-1;font-size:.88rem;color:var(--soft);word-break:break-all;margin:6px 0 0}

/* ---------- Steps ---------- */
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;position:relative;padding-left:48px;min-height:36px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700}
.steps b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks .ico{color:var(--link);margin-top:3px}

.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--soft);font-size:.88rem;line-height:1.45}
.foot b{display:block;color:var(--ink);font-family:var(--serif);font-size:1rem;font-weight:600;margin-bottom:4px}

/* ---------- Tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{display:grid;grid-template-columns:repeat(4,1fr);max-width:680px;margin:0 auto;padding:0;list-style:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 10px;font-size:.78rem;font-weight:600;color:var(--soft);text-decoration:none;border-top:3px solid transparent;min-height:58px}
.tabbar a .ico{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--link);border-top-color:var(--red)}
.tabbar a .tab-ico{width:32px;height:32px;display:block;margin:-4px 0 -3px}
.tabbar a.help{color:var(--ink)}

noscript .wrap{padding-block:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topics .badge,:root:not([data-theme="light"]) .avatar,:root:not([data-theme="light"]) .topic-icon,:root:not([data-theme="light"]) .steps li::before,:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#2A2A2A;border:1px solid #444}}
.top,.hero,.crisis{background:var(--brand)}
</style>
</head>

function ico(n, cls){
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+ICONS[n]+'</svg>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function initials(n){ var p=n.split(' '); return (p[0][0]+p[p.length-1][0]).toUpperCase(); }
function telHref(p){ return 'tel:+1'+p.replace(/\D/g,''); }
function findTopic(id){ for(var i=0;i<TOPICS.length;i++){ if(TOPICS[i].id===id) return TOPICS[i]; } return null; }

function reportBtn(label, cls){
  return '<a class="btn '+(cls||'red')+'" href="'+FORM_URL+'" target="_blank" rel="noopener noreferrer">'+ico('report')+esc(label||'Submit a report')+'<span class="sr"> (opens the report form in a new tab)</span></a>';
}
function emergencyNotice(showHelp){
  return '<div class="notice" role="note">'+ico('alert')+'<div><p><b>'+esc(EMERGENCY)+'</b></p>'+
    (showHelp?'<div class="row"><a class="btn big" href="#/help"><img class="help-ico" alt="" src="'+HELP_IMG+'" width="48" height="48"><span>Click here for more ways to get help</span></a></div>':'')+'</div></div>';
}
function lineCard(l){
  var acts=l.acts.map(function(a){return '<a class="btn sm" href="'+a.u+'">'+ico(a.i)+esc(a.l)+'</a>';}).join('');
  return '<li class="line"><b>'+esc(l.n)+'</b><p>'+esc(l.d)+'</p><div class="row">'+acts+'</div></li>';
}
function footer(){
  return '<footer class="foot"><b>'+esc(APP_TITLE)+'</b>This app doesn’t ask for or save any information about you. A report is only sent when you submit the school’s report form. Reports are not anonymous, and the adults who handle them keep things as private as possible while still keeping everyone safe.</footer>';
}
function nextStep(){
  return '<section class="next" aria-labelledby="nx"><h2 id="nx">Ready to tell someone?</h2>'+
    '<p>You can share as much or as little as you’re comfortable with.</p>'+
    '<div class="row">'+reportBtn('Submit a report')+
    '<a class="btn ghost" href="#/people">'+ico('people')+esc(REFER)+'</a></div></section>';

function renderBlock(b){
  var h='<section class="block'+(b.key?' key':'')+'">';
  if(b.h) h+='<h3>'+esc(b.h)+'</h3>';
  if(b.compare){
    h+='<div class="compare">'+
      ['no','yes'].map(function(k){
        var c=b.compare[k];
        return '<div class="'+k+'"><h4>'+esc(c.t)+'</h4><ul>'+c.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>';
      }).join('')+'</div>';
  }
  (b.p||[]).forEach(function(t){ h+='<p>'+esc(t)+'</p>'; });
  if(b.bullets) h+='<ul>'+b.bullets.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>';
  (b.after||[]).forEach(function(t){ h+='<p>'+esc(t)+'</p>'; });
  if(b.links){
    h+='<ul class="links">'+b.links.map(function(l){
      if(l.tel){
        return '<li><a href="'+l.u+'"><span>'+esc(l.t)+'</span>'+ico('phone')+'</a></li>';
      }
      return '<li><a href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer"><span>'+esc(l.t)+
        '<small>'+esc(host(l.u))+' · opens in a new tab</small></span>'+ico('ext')+'</a></li>';
    }).join('')+'</ul>';
  }
  return h+'</section>';
}
function renderPanel(t, aud){
  var blocks=(t[aud]||[]).concat(t.all||[]);
  return '<div class="'+(aud==='friend'?'friend':'self')+'">'+blocks.map(renderBlock).join('')+'</div>';
}

   Router + tab bar
================================================================== */
var main=document.getElementById('main');
var tabsEl=document.getElementById('tabs');
var TABS=[
  {k:'home',   l:'Home',      h:'#/',       i:'home'},
  {k:'report', l:'Report',    h:'#/report', i:'report'},
  {k:'people', l:'People',    h:'#/people', i:'people'},
  {k:'help',   l:'Help now',  h:'#/help',   i:'buoy', c:'help'}
];
function drawTabs(active){
  tabsEl.innerHTML=TABS.map(function(t){
    var glyph = t.k==='help' ? '<img class="tab-ico" alt="" src="'+HELP_IMG+'" width="32" height="32">' : ico(t.i);
    return '<li><a href="'+t.h+'"'+(t.c?' class="'+t.c+'"':'')+(t.k===active?' aria-current="page"':'')+'>'+glyph+'<span>'+t.l+'</span></a></li>';
  }).join('');
}

var current=null;
function route(){
  var parts=location.hash.replace(/^#\/?/,'').split('/');
  var view, tab='home';
  switch(parts[0]){
    case 'report': view=viewReport(); tab='report'; break;
    case 'people': view=viewPeople(); tab='people'; break;
    case 'help':   view=viewHelp();   tab='help';   break;
    case 'topic':  view=viewTopic(parts[1]); tab='home'; break;
    default:       view=viewHome();
  }
  current=view;
  main.innerHTML=view.html;
  document.title=view.title;
  drawTabs(tab);
  window.scrollTo(0,0);
  var h=document.getElementById('pg');
  if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}

document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-aud]');
  if(!b||!current||!current.topic) return;
  var aud=b.getAttribute('data-aud');
  var all=main.querySelectorAll('[data-aud]');
  for(var i=0;i<all.length;i++){ all[i].setAttribute('aria-pressed', all[i]===b?'true':'false'); }
  document.getElementById('panel').innerHTML=renderPanel(current.topic, aud);
});

window.addEventListener('hashchange',route);
route();
})();
</script>
